name: SafeVault Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要创建或更新的版本标签，例如 v1.3.4"
        required: true
        default: v1.3.4
        type: string
      source_ref:
        description: "用于构建的分支或提交，例如 main"
        required: true
        default: main
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SAFEVAULT_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAFEVAULT_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SAFEVAULT_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SAFEVAULT_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/safevault-release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=safevault-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Stable Android release signing configured."
          else
            echo "::warning::SAFEVAULT_ANDROID_* signing secrets are not configured; this release will use a temporary debug signature and cannot update an APK signed with another key."
          fi
      - working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi
      - name: Rename Android APK
        run: |
          if [ -f android/keystore.properties ]; then
            mv android/app/build/outputs/apk/release/app-release.apk "SafeVault-Android-${RELEASE_TAG}.apk"
          else
            mv android/app/build/outputs/apk/debug/app-debug.apk "SafeVault-Android-${RELEASE_TAG}.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: SafeVault-Android-${{ env.RELEASE_TAG }}.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build iOS simulator app
        working-directory: ios/App
        run: >-
          xcodebuild
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent ios/App/build/Build/Products/Debug-iphonesimulator/App.app "SafeVault-iOS-Simulator-${RELEASE_TAG}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-simulator
          path: SafeVault-iOS-Simulator-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error

  nas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble NAS package
        run: |
          package_dir="release/SafeVault-NAS-${RELEASE_TAG}"
          mkdir -p "$package_dir/dist" "$package_dir/server" "$package_dir/data" "$package_dir/safevault-backup"
          cp -R dist/. "$package_dir/dist/"
          cp -R server/. "$package_dir/server/"
          cp package.json deploy/docker-compose.yml "$package_dir/"
          (cd release && zip -qr "SafeVault-NAS-${RELEASE_TAG}.zip" "SafeVault-NAS-${RELEASE_TAG}")
      - uses: actions/upload-artifact@v4
        with:
          name: release-nas
          path: release/SafeVault-NAS-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package Windows desktop app
        run: |
          npx --yes @electron/packager . SafeVault \
            --platform=win32 \
            --arch=x64 \
            --out=release/desktop \
            --overwrite \
            --prune=true \
            --ignore='^/(android|ios|tests|docs|deploy|data|safevault-backup|release|\.git)/'
          (cd release/desktop && zip -qr "../SafeVault-Windows-x64-${RELEASE_TAG}.zip" SafeVault-win32-x64)
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop
          path: release/SafeVault-Windows-x64-${{ env.RELEASE_TAG }}.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [android, ios, nas, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Show release assets
        run: find release-assets -maxdepth 2 -type f -print
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SafeVault ${{ env.RELEASE_TAG }}
          # GitHub rejects refs/tags/... as target_commitish when the workflow
          # is triggered by a tag. Use the exact checked-out commit instead.
          target_commitish: ${{ github.event_name == 'push' && github.sha || inputs.source_ref }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
