name: Mobile Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Capacitor 8 and its Android library compile with Java 21 bytecode.
          java-version: 21
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.SAFEVAULT_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SAFEVAULT_ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SAFEVAULT_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SAFEVAULT_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/safevault-release.keystore
            cat > android/keystore.properties <<EOF
          storeFile=safevault-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
            echo "Stable Android release signing configured."
          else
            echo "::warning::SAFEVAULT_ANDROID_* signing secrets are not configured; this build will use a temporary debug signature."
          fi
      - working-directory: android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          set -o pipefail
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease 2>&1 | tee ../gradle-build.log
          else
            ./gradlew --no-daemon assembleDebug 2>&1 | tee ../gradle-build.log
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Gradle-Log-${{ github.run_id }}
          path: gradle-build.log
      - if: failure()
        run: |
          message="$(tail -c 5000 gradle-build.log)"
          message="${message//'%'/'%25'}"
          message="${message//$'\n'/'%0A'}"
          message="${message//$'\r'/'%0D'}"
          echo "::error title=Android Gradle build failed::$message"
      - uses: actions/upload-artifact@v4
        with:
          name: SafeVault-Android-${{ github.ref_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - working-directory: ios/App
        run: >-
          xcodebuild
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - run: ditto -c -k --sequesterRsrc --keepParent ios/App/build/Build/Products/Debug-iphonesimulator/App.app SafeVault-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SafeVault-iOS-Simulator-${{ github.ref_name }}
          path: SafeVault-iOS-Simulator.zip
