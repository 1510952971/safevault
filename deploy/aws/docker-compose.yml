services:
  safevault:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    expose:
      - "8088"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8088"
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backup
      STATIC_DIR: /app/dist
      REQUIRE_HTTPS: "true"
      TRUST_PROXY: "true"
      CORS_ORIGIN: ${CORS_ORIGIN}
      MAX_BODY_BYTES: "10485760"
    volumes:
      - ./data:/app/data
      - ./backup:/app/backup
    healthcheck:
      # The application requires HTTPS when it trusts the reverse proxy.  The
      # health probe must model Caddy's forwarded protocol or Caddy will never
      # start because it waits for this container to become healthy.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/api/version',{headers:{'x-forwarded-proto':'https'}}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      safevault:
        condition: service_healthy
    environment:
      SAFEVAULT_DOMAIN: ${SAFEVAULT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
