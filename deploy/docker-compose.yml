services:
  safevault:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: safevault:latest
    container_name: safevault-nas
    restart: unless-stopped
    ports:
      # NAS 外部映射端口 : 容器内部端口 (极空间可自定义端口如 8088:8088)
      - "8088:8088"
    volumes:
      # 持久化数据目录：将极空间 NAS 物理存储目录映射进容器的 /app/data
      - ../data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=8088
