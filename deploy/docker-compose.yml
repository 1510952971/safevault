services:
  safevault:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: safevault:latest
    container_name: safevault-nas
    restart: unless-stopped
    ports:
      # NAS 外部映射端口 : 容器内部端口 (极空间可自定义端口如 8088:8088)
      - "8088:8088"
    volumes:
      # 持久化数据目录：将极空间 NAS 物理存储目录映射进容器的 /app/data
      - ../data:/app/data
      # 独立灾备目录：必须与 data 分开，删除 data 时备份仍然存在
      - ../safevault-backup:/app/backup
    environment:
      - TZ=Asia/Shanghai
      - PORT=8088
      - DATA_DIR=/app/data
      - BACKUP_DIR=/app/backup
      # 通过 NAS / Nginx / Caddy 的 HTTPS 反向代理访问时启用；局域网直连 HTTP 请保持 false。
      - REQUIRE_HTTPS=false
      # 生产环境填写前端 HTTPS 域名；同源访问无需填写，但保留移动端来源。
      - CORS_ORIGIN=https://safevault.eyeme.online,http://localhost:3000,https://localhost,capacitor://localhost
