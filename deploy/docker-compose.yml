services:
  safevault:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: safevault:latest
    container_name: safevault-nas
    restart: unless-stopped
    ports:
      # NAS 外部映射端口 : 容器内部端口 (极空间可自定义端口如 8088:8088)
      - "8088:8088"
    volumes:
      # 持久化数据目录：将极空间 NAS 物理存储目录映射进容器的 /app/data
      - ../data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=8088
      # 通过 NAS / Nginx / Caddy 的 HTTPS 反向代理访问时启用；局域网直连 HTTP 请保持 false。
      - REQUIRE_HTTPS=false
      # 生产环境填写前端 HTTPS 域名，例如 https://vault.example.com；不要使用 *。
      # 域名变化时，把新旧前端入口都写入，逗号分隔；同源访问无需填写。
      - CORS_ORIGIN=https://vault.example.com,http://localhost:3000
