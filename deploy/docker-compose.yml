services:
  safevault:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: safevault:latest
    container_name: safevault-nas
    restart: unless-stopped
    ports:
      # NAS 外部映射端口 : 容器内部端口 (可在 NAS 容器管理页面自由调整如 8088:80)
      - "8088:80"
    environment:
      - TZ=Asia/Shanghai
